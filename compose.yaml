services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_tracker
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d order_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ordertracker_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: